name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_e2e_tests:
        description: 'Run E2E tests (takes ~10+ minutes)'
        required: false
        default: 'false'
        type: boolean
  schedule:
    # Run daily at 00:00 UTC (adjust timezone as needed)
    - cron: '0 0 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Generate puzzle data
        run: python scripts/daily_update.py || echo "Puzzle generation failed or puzzle already exists, continuing..."
        continue-on-error: true

      - name: Commit and push puzzle data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/data/puzzles/ public/data/popular_sets.json
          if git diff --staged --quiet; then
            echo "No puzzle changes to commit"
          else
            git commit -m "Add puzzle data for $(date +%Y-%m-%d)" || exit 1
            git push origin HEAD:main || {
              echo "Push failed. Checking remote configuration..."
              git remote -v
              exit 1
            }
          fi

      - name: Run unit tests
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_e2e_tests == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_e2e_tests == 'true'
        run: npm run test:e2e || echo "E2E tests failed, continuing deployment..."
        env:
          CI: true
        continue-on-error: true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
